apiVersion: v1
kind: Namespace
metadata:
  name: snap-camera


---

apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: snap-camera
type: Opaque
stringData:
  mysql-root-password: snaproot2026
  mysql-user: snap
  mysql-password: snapuser2026
  mysql-database: snapcamera


---

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: snap-camera
data:
  default.conf.template: |
    server {
        listen 8080;
        server_name studio-app.snapchat.com;

        location / {
            proxy_pass http://webapp:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location /snap-camera-media/ {
            alias /usr/share/nginx/html/snap-camera-media/;
        }

        location /snap-camera-categories-media/ {
            alias /usr/share/nginx/html/snap-camera-categories-media/;
        }
    }


---

apiVersion: v1
kind: Secret
metadata:
  name: ssl-certs
  namespace: snap-camera
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 


---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: snap-camera
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi


---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webapp-storage-pvc
  namespace: snap-camera
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi


---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-storage-pvc
  namespace: snap-camera
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi


---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: snap-camera
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snap-mysql
  template:
    metadata:
      labels:
        app: snap-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-database
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-password
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc


---

apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: snap-camera
spec:
  selector:
    app: snap-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306


---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: snap-camera
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snap-webapp
  template:
    metadata:
      labels:
        app: snap-webapp
    spec:
      containers:
        - name: webapp
          image: ghcr.io/lochis/snap-camera-server:sha-becef83
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-database
            - name: DB_PORT
              value: '3306'
            - name: PORT
              value: '3000'
            - name: BRIDGE_ADDR
              value: ws://webapp:3000
            - name: STORAGE_SERVER
              value: http://webproxy:8080
            - name: STORAGE_PATH
              value: /var/lib/snapcamera
            - name: IMPORT_DIR
              value: import
            - name: MEDIA_DIR
              value: snap-camera-media
            - name: MEDIA_DIR_ALT
              value: snap-camera-media-alt
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: storage
              mountPath: /var/lib/snapcamera
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: webapp-storage-pvc


---

apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: snap-camera
spec:
  selector:
    app: snap-webapp
  ports:
    - name: http
      port: 3000
      targetPort: 3000


---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: webproxy
  namespace: snap-camera
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snap-webproxy
  template:
    metadata:
      labels:
        app: snap-webproxy
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          env:
            - name: HTTP_PORT
              value: '8080'
            - name: WEBAPP_PORT
              value: '3000'
          ports:
            - containerPort: 8080
            - containerPort: 8443
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/templates
            - name: ssl-certs
              mountPath: /etc/ssl
            - name: nginx-media
              mountPath: /usr/share/nginx/html/snap-camera-media
            - name: nginx-categories
              mountPath: /usr/share/nginx/html/snap-camera-categories-media
            - name: storage
              mountPath: /usr/share/nginx/html
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: ssl-certs
          secret:
            secretName: ssl-certs
        - name: nginx-media
          emptyDir: {}
        - name: nginx-categories
          emptyDir: {}
        - name: storage
          persistentVolumeClaim:
            claimName: nginx-storage-pvc


---

apiVersion: v1
kind: Service
metadata:
  name: webproxy
  namespace: snap-camera
spec:
  type: NodePort
  selector:
    app: snap-webproxy
  ports:
    - name: http
      port: 8080
      nodePort: 30080
    - name: https
      port: 443
      nodePort: 30443


---

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: snap-camera
  namespace: snap-camera
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`studio-app.snapchat.com`)
      kind: Rule
      services:
        - name: webproxy
          port: 8080
  tls:
    secretName: ssl-certs
