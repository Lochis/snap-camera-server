############################
# Namespace
############################
apiVersion: v1
kind: Namespace
metadata:
  name: snap-camera

---
############################
# MySQL Secret (root-only)
############################
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: snap-camera
type: Opaque
stringData:
  mysql-root-password: "123456"
  mysql-database: snapcamera
---
############################
# MySQL Persistent Volume
############################
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: snap-camera
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
--- 
############################
# MySQL Deployment
############################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: snap-camera
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snap-mysql
  template:
    metadata:
      labels:
        app: snap-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-database
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
---
############################
# MySQL Service
############################
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: snap-camera
spec:
  selector:
    app: snap-mysql
  ports:
    - port: 3306
      targetPort: 3306
---
############################
# Webapp Storage PVC
############################
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webapp-storage-pvc
  namespace: snap-camera
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
############################
# Webapp Deployment
############################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: snap-camera
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snap-webapp
  template:
    metadata:
      labels:
        app: snap-webapp
    spec:
      containers:
        - name: webapp
          image: ghcr.io/lochis/snap-camera-server:sha-41e6afd
          ports:
            - containerPort: 5645
          env:
            - name: NODE_ENV
              value: production
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: root
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-database

            - name: PORT
              value: "5645"

            - name: BRIDGE_ADDR
              value: ws://camera-kit-bridge:3000

            - name: STORAGE_PATH
              value: /var/lib/snapcamera
            - name: IMPORT_DIR
              value: import
            - name: MEDIA_DIR
              value: snap-camera-media
            - name: MEDIA_DIR_ALT
              value: snap-camera-media-alt

            - name: STORAGE_SERVER
              value: https://studio-app.snapchat.com
          volumeMounts:
            - name: storage
              mountPath: /var/lib/snapcamera
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: webapp-storage-pvc
---
############################
# Webapp Service
############################
apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: snap-camera
spec:
  selector:
    app: snap-webapp
  ports:
    - port: 5645
      targetPort: 5645
---
############################
# NGINX ConfigMap
############################
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: snap-camera
data:
  default.conf.template: |
    server {
      listen 80;
      server_name studio-app.snapchat.com;

      location / {
        proxy_pass http://webapp:5645;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }

      location /snap-camera-media/ {
        alias /var/www/snapcamera/snap-camera-media/;
      }

      location /snap-camera-categories-media/ {
        alias /var/www/snapcamera/snap-camera-categories-media/;
      }
    }
---
############################
# Webproxy Storage PVC
############################
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-storage-pvc
  namespace: snap-camera
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
############################
# Webproxy Deployment
############################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webproxy
  namespace: snap-camera
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snap-webproxy
  template:
    metadata:
      labels:
        app: snap-webproxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          env:
            - name: WEBAPP_HOST
              value: webapp
            - name: WEBAPP_PORT
              value: "5645"
            - name: HTTP_PORT
              value: "80"
            - name: WWW_ROOT
              value: /var/www/snapcamera
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/templates
            - name: storage
              mountPath: /var/www/snapcamera
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: storage
          persistentVolumeClaim:
            claimName: nginx-storage-pvc
---
############################
# Webproxy Service
############################
apiVersion: v1
kind: Service
metadata:
  name: webproxy
  namespace: snap-camera
spec:
  type: ClusterIP
  selector:
    app: snap-webproxy
  ports:
    - name: http
      port: 80
      targetPort: 80

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: snap-camera
  namespace: snap-camera
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`studio-app.snapchat.com`)
      kind: Rule
      services:
        - name: webproxy
          port: 80
  tls:
    secretName: ssl-certs



